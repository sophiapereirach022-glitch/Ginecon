<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ginecon – Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script type="module" defer src="../JS/paginas/login.js"></script>
</head>
<body>
  <main class="card">
    <h1 class="logo">ginecon</h1>

    <!-- LOGIN -->
    <section id="login" class="painel">
      <h2>Entrar na sua conta</h2>
      <form id="form-login" action="#" method="post">
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
        </div>
        <a href="forum.html"><button type="submit" class="botao">Entrar</button></a>
        
      </form>
      <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

</body>
</html>
