<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/forum.css">
    <script type="module" src="/JS/paginas/forum.js"></script>
    <script type="module" src="/JS/reutilizaveis/index.js"></script>
    <title>Ginecon Fórum</title>
</head>

<body>
    <!-- Cabeçalho -->
    <header id="cabecalho">
        <h1>Ginecon Fórum</h1>
        <div id="usuario-area">
            <button id="BotaoUsuario">Usuario</button>
            <button id="BotaoSair">Sair</button>
        </div>
    </header>

    <div id="layout">
        <!-- Coluna principal: perguntas -->
        <main id="feed">
           <div id="barra-feed">
    <button id="PostarComentario">+ Postar</button>
    <div id="ordenacao">
        <button class="ordem ativo" data-ordem="relevantes">Relevantes</button>
        <button class="ordem" data-ordem="recentes">Recentes</button>
    </div>
</div>
            <section id="lista-postagens"></section>
        </main>

        <!-- Barra lateral -->
        <aside id="sidebar">
            <input type="search" id="campo-pesquisa" placeholder="Pesquisar...">
            <ul id="lista-topicos"></ul>
        </aside>
    </div>

    <!-- Modal Post -->
    <div id="overlay-modal-postagem">
        <div id="modal-postagem">
            <button id="botao-fechar-modal-postagem">✕</button>

            <div id="etapa-1">
                <div class="campo-modal">
                    <label for="pergunta">Pergunta</label>
                    <textarea id="pergunta" name="pergunta" placeholder="Digite sua pergunta..."></textarea>
                </div>

                <div class="campo-modal">
                    <label for="especialidade-postagem">Especialidade necessária</label>
                    <select id="especialidade-postagem">
                        <option value="Desconhecida">Não sei</option>
                        <option value="Area1">Area1</option>
                        <option value="Area2">Area2</option>
                        <option value="Area3">Area3</option>
                        <option value="Area4">Area4</option>
                        <option value="Area5">Area5</option>
                    </select>
                </div>

                <div class="campo-modal">
                    <label>Postar de forma anônima?</label>
                    <div class="radios">
                        <label><input type="radio" name="anonimo" value="sim"> Sim</label>
                        <label><input type="radio" name="anonimo" value="nao" checked> Não</label>
                    </div>
                </div>

                <button id="botao-confirmar-postagem">Publicar</button>
            </div>
        </div>
    </div>
</body>

</html>
