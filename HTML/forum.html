<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/forum.css">
    <script type="module" src="/JS/paginas/forum.js"></script>
    <script type="module" src="/JS/reutilizaveis/index.js"></script>
    <title>Ginecon Fórum</title>
</head>

<body>
    <!-- Cabeçalho -->
    <header id="cabecalho" class="header">
    <nav class="nav" aria-label="Navegação principal">
        <a class="nav-logo" href="../index.html#topo">GINECON</a>

        <ul class="nav-lista">
            <li><a href="../index.html#topo">Início</a></li>
            <li><a href="forum.html">Fórum</a></li>
            <li><a href="../index.html#destaqueForum">Destaques</a></li>
            <li><a href="../index.html#faq">Se conhecendo</a></li>
            <li><a href="../index.html#snos">Sobre nós</a></li>
        </ul>

        <div id="usuario-area">
            <button id="BotaoUsuario">Usuario</button>
            <button id="BotaoSair">Sair</button>
        </div>
    </nav>
</header>

    <div id="layout">

        <!-- Coluna principal: perguntas -->
        <main id="feed">
            <p id="aviso-observador" class="aviso-observador" hidden>
                Você está no modo observador: pode ler as perguntas e respostas, mas não pode postar, votar nem
                responder.
                <a href="login.html">Entrar</a>
            </p> 
            <div id="barra-feed">
                <button id="PostarComentario">+ Postar</button>
                <div id="ordenacao">
                    <button class="ordem ativo" data-ordem="relevantes">Relevantes</button>
                    <button class="ordem" data-ordem="recentes">Recentes</button>
                </div>
            </div>
            <section id="lista-postagens"></section>
        </main>

        <!-- Barra lateral -->
        <aside id="sidebar">
            <input type="search" id="campo-pesquisa" placeholder="Pesquisar...">
            <ul id="lista-topicos"></ul>
        </aside>
    </div>

    <!-- Modal Post -->
    <div id="overlay-modal-postagem">
        <div id="modal-postagem">
            <button id="botao-fechar-modal-postagem">✕</button>

            <div id="etapa-1">
                <div class="campo-modal">
                    <label for="pergunta">Pergunta</label>
                    <textarea id="pergunta" name="pergunta" placeholder="Digite sua pergunta..."></textarea>
                </div>

                <div class="campo-modal">
                    <label for="especialidade-postagem">Especialidade necessária</label>
                    <select id="especialidade-postagem">
                        <option value="Desconhecida">Não sei</option>
                        <option value="Saude Menstrual e Puberdade">Saude Menstrual e Puberdade</option>
                        <option value="Contracepção e Planejamento Reprodutivo">Contracepção e Planejamento Reprodutivo</option>
                        <option value="Sexualidade, Autonomia e Saúde Mental">Sexualidade, Autonomia e Saúde Mental</option>
                        <option value="Endocrinologia Ginecológica">Endocrinologia Ginecológica</option>
                    </select>
                </div>

                <div class="campo-modal">
                    <label>Postar de forma anônima?</label>
                    <div class="radios">
                        <label><input type="radio" name="anonimo" value="sim"> Sim</label>
                        <label><input type="radio" name="anonimo" value="nao" checked> Não</label>
                    </div>
                </div>

                <button id="botao-confirmar-postagem">Publicar</button>
            </div>
        </div>
    </div>
</body>

</html>
